<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#76ff9a"/><stop offset="1" stop-color="#1dd86f"/></linearGradient><style>.bg{fill:#080b0a}.p{fill:#101613;stroke:#2d7d4c;stroke-width:2}.t{fill:#eef5f1;font-family:Arial,sans-serif}.m{fill:#8ea39a;font-family:Arial,sans-serif}.g{fill:url(#g);font-family:Arial,sans-serif}.s{font-size:24px}.h{font-size:44px;font-weight:700}.h2{font-size:30px;font-weight:700}.mono{font-family:Consolas,monospace;font-size:22px;fill:#bfffd0}.line{stroke:#45f08c;stroke-width:3;fill:none}</style></defs><rect class="bg" width="1600" height="900"/><circle cx="800" cy="-120" r="520" fill="#0c1511" stroke="#1d5c39" stroke-width="2"/><path d="M0 820 Q420 760 820 820 T1600 810" stroke="#1bdc70" stroke-width="4" fill="none" opacity=".65"/><text x="70" y="75" class="g h">ASTRA WORKSPACE</text><text x="70" y="112" class="m s">LOCAL-FIRST · INSPECTABLE · APPROVAL-AWARE</text><text x="800" y="175" text-anchor="middle" class="t h">Getting Started with <tspan fill="#5cff94">Astra Workspace</tspan></text><rect x="50" y="240" width="225" height="360" rx="20" class="p"/><text x="70" y="285" class="g h2">01</text><text x="70" y="335" class="t h2">Clone</text><rect x="68" y="455" width="189" height="100" rx="12" fill="#0a0f0c" stroke="#21472f"/><text x="78" y="500" class="mono" style="font-size:13px">git clone github.com/Fal</text><text x="78" y="530" class="mono" style="font-size:13px">lenproud/astra-workspace.git</text><rect x="305" y="240" width="225" height="360" rx="20" class="p"/><text x="325" y="285" class="g h2">02</text><text x="325" y="335" class="t h2">Enter folder</text><rect x="323" y="455" width="189" height="100" rx="12" fill="#0a0f0c" stroke="#21472f"/><text x="333" y="500" class="mono" style="font-size:13px">cd astra-workspace</text><rect x="560" y="240" width="225" height="360" rx="20" class="p"/><text x="580" y="285" class="g h2">03</text><text x="580" y="335" class="t h2">Install</text><rect x="578" y="455" width="189" height="100" rx="12" fill="#0a0f0c" stroke="#21472f"/><text x="588" y="500" class="mono" style="font-size:13px">npm ci</text><rect x="815" y="240" width="225" height="360" rx="20" class="p"/><text x="835" y="285" class="g h2">04</text><text x="835" y="335" class="t h2">Build</text><rect x="833" y="455" width="189" height="100" rx="12" fill="#0a0f0c" stroke="#21472f"/><text x="843" y="500" class="mono" style="font-size:13px">npm run build</text><rect x="1070" y="240" width="225" height="360" rx="20" class="p"/><text x="1090" y="285" class="g h2">05</text><text x="1090" y="335" class="t h2">Start</text><rect x="1088" y="455" width="189" height="100" rx="12" fill="#0a0f0c" stroke="#21472f"/><text x="1098" y="500" class="mono" style="font-size:13px">npm start</text><rect x="1325" y="240" width="225" height="360" rx="20" class="p"/><text x="1345" y="285" class="g h2">06</text><text x="1345" y="335" class="t h2">Open</text><rect x="1343" y="455" width="189" height="100" rx="12" fill="#0a0f0c" stroke="#21472f"/><text x="1353" y="500" class="mono" style="font-size:13px">127.0.0.1:4317</text><rect x="310" y="655" width="980" height="100" rx="18" class="p"/><text x="800" y="700" text-anchor="middle" class="g h2">Default preview uses a deterministic simulator.</text><text x="800" y="735" text-anchor="middle" class="m s">No API key required for the default local experience.</text><text x="70" y="865" class="m s">Created by Fallenproud  ·  Solutions &amp; collaboration: daycostra.com</text></svg>